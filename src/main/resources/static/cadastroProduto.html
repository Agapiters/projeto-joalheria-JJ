<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cadastroProduto.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon"> <!-- foto da aba do site -->
    <link rel="icon" href="./img/logo.png" sizes="32x32">
    <title>Produto JJ</title>
</head>

<body>
    <div class="box">
        <div class="form-box">
            <h1>Cadastro Produto</h1>
            <form class="form" id="cadastroProdutoForm">
                <div class="inserir">
                    <label for="nomeProduto"> Nome </label>
                    <input type="text" id="nomeProduto" placeholder="Digite o nome da peça" required>
                </div>

                <div class="inserir">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Monte a descrição da peça" required>
                </div>

                <div class="inserir">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco" placeholder="Insira o preço" step="0.01" required>
                </div>
                <div class="grid">

                    <div class="selecione">
                        <label for="cadastrar">Categoria</label>
                        <select id="categoriaProduto" class="opcoes" name="categoriaProduto" required>
                            <option value="">Selecione...</option>
                            <option value="1">Novidade</option>
                            <option value="2">Desconto</option>
                            <option value="3">Colar</option>
                            <option value="4">Anel</option>
                            <option value="5">Brinco</option>
                        </select>
                    </div>
                    <div class="selecione">
                        <label for="tipoProduto">Tipo</label>
                        <select id="tipoProduto" class="opcoes" name="tipoProduto" required>
                            <option value="">Selecione...</option>
                            <option value="1">Ouro</option>
                            <option value="2">Prata</option>
                        </select>

                    </div>

                </div>

                <br>
                <div class="selecione">
                    <label for="ornamentoProduto">Ornamento</label>
                    <select id="ornamentoProduto" class="opcoes" name="ornamentoProduto" required>
                        <option value="">Selecione...</option>
                        <option value="1">Diamante rosa</option>
                        <option value="2">Quartzo rosa</option>
                        <option value="3">Turmalina rosa</option>
                        <option value="4">Morganita</option>
                    </select>

                </div>
                <br>
                <div class="inserir">
                    <label for="img">URL da imagem</label>
                    <input type="url" id="img" placeholder="Insira o URL da imagem" required>
                </div>


                <br>

                <div>
                    <input type="submit" class="cadastrar" value="Cadastrar" id="enviar">
                </div>
            </form>
        </div>
    </div>
    <script src="JavaScript/scriptCadastroProduto.js"></script>
</body>

</html>
