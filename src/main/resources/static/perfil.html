<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon"> <!-- foto da aba do site -->
    <link rel="icon" href="./img/logo.png" sizes="32x32">
    <title>Cadastro Jóias Jóia</title>
</head>

<body>
    <div class="box">
        <div class="form-box">
            <form class="form" id="formCadastroUsuario">
                <div class="fundo">
                    <div>
                        <strong>Nome:</strong> <span id="nomeUsuario"></span>
                    </div>

                    <div>
                        <strong>Email:</strong> <span id="email"></span>
                    </div>

                    <div>
                        <strong>Telefone:</strong> <span id="telefone"></span>
                    </div>

                    <div>
                        <strong>CPF:</strong> <span id="cpf"></span>
                    </div>

                    <div>
                        <strong>Data de Nascimento:</strong> <span id="dtNascimento" required></span>
                    </div>
                </div>


                <button class="logout" id="logoutBtn">Logout</button>
            </form>
        </div>
    </div>
    </div>
    <script src="JavaScript/scriptCadastro.js"></script>
	<script src="JavaScript/perfil.js"></script>
	
</body>

</html>
